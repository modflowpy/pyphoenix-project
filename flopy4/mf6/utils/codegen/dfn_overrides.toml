# Local DFN field overrides pending upstream modflow6 repository PRs.
#
# Format: ["<dfn-name>".<field-name>]
#           <FieldV2-attribute> = <value>
#
# Remove each entry once the corresponding upstream PR merges.

# Package-level overrides: real MF6 runtime/structural facts the DFN schema
# has no way to express, not stopgaps for an upstream data gap. These are not
# expected to be removable once some upstream PR merges -- see each entry.

[_package_extras."gwt-ssm"]
# SOURCES is a genuinely required block (IDM required=.true. in
# src/Idm/gwt-ssmidm.f90, matching optional=false in the DFN) -- MF6 errors
# if it's absent even when there's no source data to write. There's no DFN
# concept of "required block, but still write it out with zero rows," so
# this can't be derived from the schema; permanent.
always_emit_blocks = ["sources"]

[_package_extras."gwe-ssm"]
# same requirement as gwt-ssm
always_emit_blocks = ["sources"]

[_package_extras."gwt-lkt"]
# nlakes comes from the paired gwf-lak model; gwt-lkt has no DIMENSIONS block
# of its own and devtools' schema has no cross-package dimension reference
# mechanism (packagedata.shape is simply []) -- permanent until one exists.
packagedata_dim = "nlakes"

[_package_extras."gwe-lke"]
# same as gwt-lkt (paired with gwf-lak)
packagedata_dim = "nlakes"
