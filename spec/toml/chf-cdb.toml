name = "chf-cdb"
multi = true

[options.auxiliary]
name = "auxiliary"
type = "string"
shape = "(naux)"
block = "options"
description = "defines an array of one or more auxiliary variable names.  there is no limit on the number of auxiliary variables that can be provided on this line; however, lists of information provided in subsequent blocks must have a column of data for each auxiliary variable name defined here.   the number of auxiliary variables detected on this line determines the value for naux.  comments cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  auxiliary variables may not be used by the package, but they will be available for use by other parts of the program.  the program will terminate with an error if auxiliary variables are specified on more than one line in the options block."

[options.boundnames]
name = "boundnames"
type = "keyword"
block = "options"
description = "keyword to indicate that boundary names may be provided with the list of critical depth boundary cells."

[options.print_input]
name = "print_input"
type = "keyword"
block = "options"
description = "keyword to indicate that the list of critical depth boundary information will be written to the listing file immediately after it is read."

[options.print_flows]
name = "print_flows"
type = "keyword"
block = "options"
description = "keyword to indicate that the list of critical depth boundary flow rates will be printed to the listing file for every stress period time step in which 'budget print' is specified in output control.  if there is no output control option and 'print_flows' is specified, then flow rates are printed for the last time step of each stress period."

[options.save_flows]
name = "save_flows"
type = "keyword"
block = "options"
description = "keyword to indicate that critical depth boundary flow terms will be written to the file specified with 'budget fileout' in output control."

[options.observations]
name = "observations"
type = "record"
block = "options"
description = "Contains data for the obs package. Data can be stored in a dictionary containing data for the obs package with variable names as keys and package data as values. Data just for the observations variable is also acceptable. See obs package documentation for more information"

[options.observations.subpackage]
parent = "parent_model_or_package"
key = "obs_filerecord"
val = "observations"
abbr = "obs"
param = "continuous"

[dimensions.maxbound]
name = "maxbound"
type = "integer"
block = "dimensions"
description = "integer value specifying the maximum number of critical depth boundary cells that will be specified for use during any stress period."

[period.stress_period_data]
name = "stress_period_data"
type = "list"
shape = "(maxbound)"
block = "period"
description = ""

[period.stress_period_data.stress_period_data]
name = "stress_period_data"
type = "record"
block = "period"
description = ""

[period.stress_period_data.stress_period_data.cellid]
block = "period"
name = "cellid"
type = "integer"
shape = "(ncelldim)"
tagged = "false"
in_record = "true"
reader = "urword"
longname = "cell identifier"
description = "is the cell identifier, and depends on the type of grid that is used for the simulation.  For a structured grid that uses the DIS input file, CELLID is the layer, row, and column.   For a grid that uses the DISV input file, CELLID is the layer and CELL2D number.  If the model uses the unstructured discretization (DISU) input file, CELLID is the node number for the cell."

[period.stress_period_data.stress_period_data.idcxs]
block = "period"
name = "idcxs"
type = "integer"
shape = ""
tagged = "false"
in_record = "true"
reader = "urword"
time_series = "false"
longname = "cross section identifier"
description = "is the identifier for the cross section specified in the CXS Package.  A value of zero indicates the zero-depth-gradient calculation will use parameters for a hydraulically wide channel."
numeric_index = "true"

[period.stress_period_data.stress_period_data.width]
block = "period"
name = "width"
type = "double precision"
shape = ""
tagged = "false"
in_record = "true"
reader = "urword"
time_series = "true"
longname = "width of the zero-depth gradient boundary"
description = "is the channel width of the zero-depth gradient boundary. If a cross section is associated with this boundary, the width will be scaled by the cross section information.  If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."

[period.stress_period_data.stress_period_data.aux]
block = "period"
name = "aux"
type = "double precision"
in_record = "true"
tagged = "false"
shape = "(naux)"
reader = "urword"
optional = "true"
time_series = "true"
longname = "auxiliary variables"
description = "represents the values of the auxiliary variables for each zero-depth-gradient boundary. The values of auxiliary variables must be present for each zero-depth-gradient boundary. The values must be specified in the order of the auxiliary variables specified in the OPTIONS block.  If the package supports time series and the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
mf6internal = "auxvar"

[period.stress_period_data.stress_period_data.boundname]
block = "period"
name = "boundname"
type = "string"
shape = ""
tagged = "false"
in_record = "true"
reader = "urword"
optional = "true"
longname = "zero-depth-gradient boundary name"
description = "name of the zero-depth-gradient boundary cell.  BOUNDNAME is an ASCII character variable that can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must be enclosed within single quotes."
