name = "prt-fmi"
multi = false

[options.save_flows]
name = "save_flows"
type = "keyword"
block = "options"
description = "keyword to indicate that fmi flow terms will be written to the file specified with 'budget fileout' in output control."

[packagedata.packagedata]
name = "packagedata"
type = "list"
block = "packagedata"

[packagedata.packagedata.packagedata]
name = "packagedata"
type = "record"
block = "packagedata"

[packagedata.packagedata.packagedata.flowtype]
block = "packagedata"
name = "flowtype"
in_record = "true"
type = "string"
tagged = "false"
reader = "urword"
longname = "flow type"
description = "is the word GWFBUDGET or GWFHEAD.  If GWFBUDGET is specified, then the corresponding file must be a budget file from a previous GWF Model run."

[packagedata.packagedata.packagedata.filein]
block = "packagedata"
name = "filein"
type = "keyword"
in_record = "true"
reader = "urword"
tagged = "true"
optional = "false"
longname = "file keyword"
description = "keyword to specify that an input filename is expected next."

[packagedata.packagedata.packagedata.fname]
block = "packagedata"
name = "fname"
in_record = "true"
type = "string"
preserve_case = "true"
tagged = "false"
reader = "urword"
longname = "file name"
description = "is the name of the file containing flows.  The path to the file should be included if the file is not located in the folder where the program was run."
