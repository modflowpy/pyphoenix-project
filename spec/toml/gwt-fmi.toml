name = "gwt-fmi"
multi = false

[options.save_flows]
name = "save_flows"
type = "keyword"
block = "options"
description = "keyword to indicate that fmi flow terms will be written to the file specified with 'budget fileout' in output control."

[options.flow_imbalance_correction]
name = "flow_imbalance_correction"
type = "keyword"
block = "options"
description = "correct for an imbalance in flows by assuming that any residual flow error comes in or leaves at the concentration of the cell.  when this option is activated, the gwt model budget written to the listing file will contain two additional entries: flow-error and flow-correction.  these two entries will be equal but opposite in sign.  the flow-correction term is a mass flow that is added to offset the error caused by an imprecise flow balance.  if these terms are not relatively small, the flow model should be rerun with stricter convergence tolerances."

[packagedata.packagedata]
name = "packagedata"
type = "list"
block = "packagedata"
description = ""

[packagedata.packagedata.packagedata]
name = "packagedata"
type = "record"
block = "packagedata"
description = ""

[packagedata.packagedata.packagedata.flowtype]
block = "packagedata"
name = "flowtype"
in_record = "true"
type = "string"
tagged = "false"
reader = "urword"
longname = "flow type"
description = "is the word GWFBUDGET, GWFHEAD, GWFMOVER or the name of an advanced GWF stress package.  If GWFBUDGET is specified, then the corresponding file must be a budget file from a previous GWF Model run.  If an advanced GWF stress package name appears then the corresponding file must be the budget file saved by a LAK, SFR, MAW or UZF Package."

[packagedata.packagedata.packagedata.filein]
block = "packagedata"
name = "filein"
type = "keyword"
shape = ""
in_record = "true"
reader = "urword"
tagged = "true"
optional = "false"
longname = "file keyword"
description = "keyword to specify that an input filename is expected next."

[packagedata.packagedata.packagedata.fname]
block = "packagedata"
name = "fname"
in_record = "true"
type = "string"
preserve_case = "true"
tagged = "false"
reader = "urword"
longname = "file name"
description = "is the name of the file containing flows.  The path to the file should be included if the file is not located in the folder where the program was run."
